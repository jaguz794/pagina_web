media:
  input: assets/ofertas
  output: /assets/ofertas
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: ofertas
    label: Ofertas de la semana
    type: file
    path: data/ofertas.json
    format: json
    list: true
    fields:
      - name: tipo
        label: Formato
        type: select
        required: true
        default: producto
        description: Usa Volante para una imagen con varios productos.
        options:
          values:
            - name: producto
              label: Producto individual
            - name: volante
              label: Volante de ofertas
            - name: portada
              label: Portada de campaña
      - name: titulo
        label: Título del producto o volante
        type: string
        required: true
      - name: descripcion
        label: Descripción breve
        type: text
      - name: imagen
        label: Foto del producto o volante
        type: image
        description: Obligatoria para volantes y portadas. Sube imágenes WebP para que carguen rápido.
      - name: precio
        label: Precio de oferta (solo producto individual)
        type: number
        description: Para productos individuales escribe solo números, sin puntos ni signo de pesos. Déjalo vacío en volantes.
        options:
          min: 0
      - name: precio_anterior
        label: Precio anterior (opcional)
        type: number
        description: Déjalo vacío si no deseas mostrar una comparación.
      - name: unidad
        label: Unidad o presentación (solo producto individual)
        type: string
        description: "Ejemplo: por kg, 500 g o unidad. Déjalo vacío en volantes."
      - name: ciudad
        label: Disponible en
        type: select
        required: true
        options:
          values:
            - name: todas
              label: Neiva e Ibagué
            - name: neiva
              label: Solo Neiva
            - name: ibague
              label: Solo Ibagué
      - name: inicio
        label: Fecha de inicio
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: fin
        label: Último día de vigencia
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: publicada
        label: Publicar oferta
        type: boolean
        default: false
        description: Activa esta opción cuando todos los datos estén revisados.
